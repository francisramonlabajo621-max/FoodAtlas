{% extends 'base.html' %}
{% block content %}
<div class="col-lg-5 mx-auto">
    <div class="glass-form p-5 rounded-4">
        <p class="text-uppercase text-accent small fw-semibold mb-2">Welcome back</p>
        <h2 class="fw-semibold mb-4">Sign in to Food Atlas</h2>
        <form method="post">
            <div class="mb-4">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control form-control-lg" required autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" required autocomplete="current-password">
            </div>
            <div class="d-flex flex-column gap-3">
                <button class="btn btn-primary px-4" type="submit">Login</button>
                <span class="text-muted small">New here? <a href="{{ url_for('register') }}">Create an account</a></span>
            </div>
        </form>
    </div>
</div>
{% endblock %}
