{% extends 'base.html' %}
{% block content %}
<div class="col-lg-6 mx-auto">
    <div class="glass-form p-5 rounded-4">
        <p class="text-uppercase text-accent small fw-semibold mb-2">Join the community</p>
        <h2 class="fw-semibold mb-4">Create your tasting profile</h2>
        <form method="post">
            <div class="mb-4">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control form-control-lg" required autocomplete="username">
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" required autocomplete="new-password" minlength="6">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control form-control-lg" required autocomplete="new-password" minlength="6">
                </div>
            </div>
            <div class="d-flex flex-column gap-3">
                <button class="btn btn-primary px-4" type="submit">Create account</button>
                <span class="text-muted small">Already a member? <a href="{{ url_for('login') }}">Log in</a></span>
            </div>
        </form>
    </div>
</div>
{% endblock %}
